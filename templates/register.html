{% extends "base.html" %}
{% block title %}Register — EventHub{% endblock %}

{% block extra_css %}
<style>
    .auth-wrapper {
        min-height: 100vh; display: flex; align-items: center;
        justify-content: center; padding: 120px 24px 60px;
        background: linear-gradient(135deg, #f6f6fb 50%, #eceafc 50%);
    }
    .auth-card {
        background: var(--white); width: 100%; max-width: 480px;
        padding: 44px 40px; border-radius: 20px; box-shadow: var(--shadow);
    }
    .auth-card h2 { text-align: center; font-size: 26px; margin-bottom: 6px; }
    .auth-sub { text-align: center; color: var(--gray); font-size: 14px; margin-bottom: 28px; }
    .form-group { margin-bottom: 18px; }
    .form-group label {
        display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px;
    }
    .input-icon { position: relative; }
    .input-icon i {
        position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
        color: var(--gray); font-size: 15px;
    }
    .form-control {
        width: 100%; padding: 13px 16px 13px 44px;
        border: 2px solid #e5e5f0; border-radius: 12px;
        font-size: 15px; transition: var(--transition); background: var(--light);
    }
    .form-control:focus {
        outline: none; border-color: var(--primary);
        background: var(--white); box-shadow: 0 0 0 4px rgba(108,92,231,.12);
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* Role selector */
    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .role-option { position: relative; cursor: pointer; }
    .role-option input { position: absolute; opacity: 0; }
    .role-card {
        border: 2px solid #e5e5f0; border-radius: 14px; padding: 18px 12px;
        text-align: center; transition: var(--transition); background: var(--light);
    }
    .role-card i { font-size: 26px; margin-bottom: 8px; display: block; }
    .role-card h4 { font-size: 15px; }
    .role-card p { font-size: 12px; color: var(--gray); }
    .role-option input:checked + .role-card {
        border-color: var(--primary); background: rgba(108,92,231,.08);
        box-shadow: 0 0 0 4px rgba(108,92,231,.12);
    }
    .role-participant i { color: var(--primary); }
    .role-organizer i { color: var(--accent); }

    .terms { display: flex; gap: 8px; font-size: 13px; color: var(--gray); margin: 18px 0; }
    .terms a { color: var(--primary); font-weight: 600; }
    .auth-footer { text-align: center; margin-top: 22px; font-size: 14px; color: var(--gray); }
    .auth-footer a { color: var(--primary); font-weight: 700; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" id="authCard">
        <h2>Create Account ✨</h2>
        <p class="auth-sub">Join EventHub in seconds — pick your role</p>

        <form method="POST" action="{{ url_for('auth.register') }}">

            <!-- Role Selection -->
            <div class="form-group">
                <label>I am joining as a...</label>
                <div class="role-grid">
                    <label class="role-option role-participant">
                        <input type="radio" name="role" value="participant" checked>
                        <div class="role-card">
                            <i class="fa-solid fa-user-graduate"></i>
                            <h4>Participant</h4>
                            <p>Attend events</p>
                        </div>
                    </label>
                    <label class="role-option role-organizer">
                        <input type="radio" name="role" value="organizer">
                        <div class="role-card">
                            <i class="fa-solid fa-bullhorn"></i>
                            <h4>Organizer</h4>
                            <p>Host events</p>
                        </div>
                    </label>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" name="name" class="form-control"
                               placeholder="John Doe" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" name="phone" class="form-control"
                               placeholder="+91 98765 43210" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <div class="input-icon">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" name="email" class="form-control"
                           placeholder="you@example.com" required>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="password" class="form-control"
                               placeholder="Min 6 characters" minlength="6" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="confirm_password" class="form-control"
                               placeholder="Repeat password" minlength="6" required>
                    </div>
                </div>
            </div>

            <label class="terms">
                <input type="checkbox" required>
                <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
            </label>

            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fa-solid fa-user-plus"></i> Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    gsap.from('#authCard', { y: 50, opacity: 0, duration: 0.9, ease: 'power3.out' });

    // Password match validation
    document.querySelector('form').addEventListener('submit', function (e) {
        const p1 = document.querySelector('[name=password]').value;
        const p2 = document.querySelector('[name=confirm_password]').value;
        if (p1 !== p2) {
            e.preventDefault();
            alert('❌ Passwords do not match! Please try again.');
        }
    });
</script>
{% endblock %}
