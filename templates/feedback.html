{% extends "base.html" %}
{% block title %}Feedback — EventHub{% endblock %}

{% block extra_css %}
<style>
    .feedback-wrapper {
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 120px 24px 70px;
        background: linear-gradient(135deg, #f6f6fb 50%, #fceef4 50%);
    }
    .feedback-card {
        background: var(--white); max-width: 520px; width: 100%;
        border-radius: 22px; padding: 44px 40px; box-shadow: var(--shadow); text-align: center;
    }
    .feedback-card h2 { font-size: 26px; margin-bottom: 6px; }
    .feedback-event {
        display: inline-flex; align-items: center; gap: 8px;
        background: var(--light); border-radius: 50px; padding: 8px 20px;
        font-size: 14px; font-weight: 600; color: var(--primary); margin: 12px 0 28px;
    }
    .stars { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
    .stars button {
        background: none; border: none; font-size: 40px; cursor: pointer;
        color: #ddddea; transition: var(--transition);
    }
    .stars button:hover { transform: scale(1.2); }
    .stars button.active { color: var(--warning); text-shadow: 0 4px 14px rgba(253,203,110,.6); }
    .rating-label { font-weight: 700; color: var(--primary); margin-bottom: 24px; min-height: 22px; }
    .feedback-card textarea {
        width: 100%; padding: 16px; border: 2px solid #e5e5f0; border-radius: 14px;
        font-size: 15px; font-family: inherit; background: var(--light);
        resize: vertical; min-height: 120px; margin-bottom: 20px; transition: var(--transition);
    }
    .feedback-card textarea:focus {
        outline: none; border-color: var(--primary); background: var(--white);
        box-shadow: 0 0 0 4px rgba(108,92,231,.12);
    }
</style>
{% endblock %}

{% block content %}
<div class="feedback-wrapper">
    <div class="feedback-card" id="fbCard">
        <h2>How was it? ⭐</h2>
        <p style="color: var(--gray); font-size: 14px;">Your feedback helps organizers improve</p>
        <div class="feedback-event">
            <i class="fa-solid fa-calendar-check"></i> {{ event.title }}
        </div>

        <form method="POST" action="{{ url_for('participant.submit_feedback', registration_id=registration.id) }}">
            <!-- Star Rating -->
            <div class="stars" id="stars">
                <button type="button" data-val="1">★</button>
                <button type="button" data-val="2">★</button>
                <button type="button" data-val="3">★</button>
                <button type="button" data-val="4">★</button>
                <button type="button" data-val="5">★</button>
            </div>
            <div class="rating-label" id="ratingLabel">Tap a star to rate</div>
            <input type="hidden" name="rating" id="ratingInput" required>

            <textarea name="comments" placeholder="Tell us what you loved (or didn't)... 💭"></textarea>

            <button type="submit" class="btn btn-primary btn-lg btn-block">
                <i class="fa-solid fa-paper-plane"></i> Submit Feedback
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    gsap.from('#fbCard', { y: 50, opacity: 0, duration: 0.9, ease: 'power3.out' });

    const labels = ['', 'Poor 😞', 'Fair 😐', 'Good 🙂', 'Great 😄', 'Amazing 🤩'];
    const stars = document.querySelectorAll('#stars button');
    const ratingInput = document.getElementById('ratingInput');
    const ratingLabel = document.getElementById('ratingLabel');

    stars.forEach(star => {
        star.addEventListener('click', () => {
            const val = +star.dataset.val;
            ratingInput.value = val;
            ratingLabel.textContent = labels[val];
            stars.forEach(s => s.classList.toggle('active', +s.dataset.val <= val));
            gsap.fromTo(star, { scale: 1.5, rotation: 20 }, { scale: 1, rotation: 0, duration: 0.4, ease: 'back.out(3)' });
        });
    });
</script>
{% endblock %}
